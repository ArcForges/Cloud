name: CI
# Owner (deku2026) PRs are verified by the host verification after the push (eng/verify.py, AD-0020), so the validation and security
# jobs skip for them; every other PR (Dependabot included) and a manual dispatch keep the full coverage, except the proof deployment
# (proof=deploy), which validates nothing again: its gate proves that both host legs verified the merged tree and deploys the
# candidate the main push built (proof-gate, eng/verification/proof-gate.ts). A main push runs only delivery: the candidate build and
# its deployment. The weekly schedule runs the security analysis: CodeQL and the quality job (dependency audit, secret scan and the
# hosted architecture gate that must follow the scan in that job).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      proof:
        description: >-
          The acceptance environment (the proof Worker on proof.arcforges.com; main only). none: nothing.
          access: verify the deployment token's R2, Queues, Workers and zone permissions. provision: access
          plus idempotent creation of the center's acceptance R2 bucket (with its lifecycle rules) and
          queues. deploy: provision plus the acceptance PostgreSQL database and the deployment of the sealed
          candidate as the Go center. observe: a read-only report of the Container application, its
          instances and rollouts; nothing is created or changed.
        type: choice
        options: [none, access, provision, deploy, observe]
        default: none
      bootstrap_sha256:
        description: >-
          Proof deploy only: the SHA-256 (64 lowercase hex characters) of the owner bootstrap token, as
          eng/verification/proof-bootstrap.ts prints it on the owner's machine. Never paste the token itself. Leave empty on
          every dispatch after the owner exists. Set together with bootstrap_expires_at.
        type: string
        required: false
        default: ""
      bootstrap_expires_at:
        description: >-
          Proof deploy only: when the bootstrap token expires, an RFC 3339 UTC instant to the second (2026-11-02T10:00:00Z),
          in the future and at most seven days ahead. Set together with bootstrap_sha256.
        type: string
        required: false
        default: ""
  schedule:
    - cron: "43 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"

jobs:
  source:
    name: Source (${{ matrix.os }})
    if: >-
      github.event_name != 'push' && github.event_name != 'schedule'
      && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'deku2026')
      && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.proof == 'deploy')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Source (ubuntu-latest) on proof dispatches: 11m59s before #127; after #127 11m34s (passed) and cancelled at the 15m cap after 15m14s (Verify the Go center 4m15s -> 5m35s/7m32s);
    # 14m42s on proof dispatch 41835733994, the last before the proof deployment stopped running it.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: ${{ matrix.os == 'ubuntu-latest' && 'npm' || '' }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
        if: runner.os == 'Linux'
      - run: npm run check:dotnet
        if: runner.os == 'Linux'
      - name: Compile managed solution on Windows
        if: runner.os == 'Windows'
        run: |
          dotnet restore Cloud.slnx --locked-mode
          dotnet build Cloud.slnx -c Release --no-restore
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.4"
          cache-dependency-path: |
            center/go.sum
            center/tools/go.sum
      # The same entry point as both verification legs: the race detector and fuzzing on Linux, the native build on both.
      - name: Verify the Go center
        run: python eng/center.py check
      - run: node tooling/project.ts licence-evaluated
      - name: Retain evaluated licence and source provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: licence-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/evidence/licence-*.json
            artifacts/evidence/source-provenance.json
          if-no-files-found: error
          retention-days: 30

  quality:
    name: Dependency audit and repository checks
    if: >-
      github.event_name != 'push'
      && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'deku2026')
      && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.proof == 'deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      # The isolated browser-acceptance package has its own lock and is never installed here; its advisories are read from the lock.
      - run: npm audit --audit-level=high --prefix eng/verification/browser
      - name: Check workflow syntax
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Scan Git history for secrets
        run: docker run --rm --network none -v "$PWD:/repo:ro" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact=100 --no-banner
      # GOV.09: the hosted architecture gate runs only after the secret scan above succeeded (RP-09), in this same job.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Build the solution for the architecture gate
        run: |
          dotnet restore Cloud.slnx --locked-mode
          dotnet build Cloud.slnx -c Release --no-restore
      - name: Forbidden-term scan
        run: npm run policy
      - name: Architecture policy gate (hosted)
        env:
          ARCFORGES_ARCHITECTURE_GATE: hosted
        run: dotnet test --project tests/ArchitectureTests -c Release --no-build --filter-class ArcForges.Cloud.ArchitectureTests.EvaluatedRepositoryGate

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'deku2026')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL (${{ matrix.language }})
    if: >-
      github.event_name != 'push'
      && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'deku2026')
      && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.proof == 'deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: matrix.language == 'go'
        with:
          go-version: "1.27.4"
          cache-dependency-path: center/go.sum
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build C# for analysis
        if: matrix.language == 'csharp'
        run: |
          dotnet restore src/ArcForges.Cloud --locked-mode
          dotnet build src/ArcForges.Cloud -c Release --no-restore
      # The center and its test packages; the bindings are the published Contracts Go module, so no .NET restore is needed.
      - name: Build Go for analysis
        if: matrix.language == 'go'
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
        run: |
          cd center
          go mod download
          go build ./...
          go test -count=1 -run '^$' ./...
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: /language:${{ matrix.language }}

  candidate:
    name: Native AOT image and Worker build
    # Phase 1 suppresses the ordinary main-push delivery candidate. PR/dispatch validation remains as before.
    # Owner PRs build it in the local hook; proof dispatch never builds a candidate.
    needs: [source, quality]
    if: >-
      github.event_name != 'push' && !cancelled() && (github.event_name == 'push' || (github.event_name != 'schedule'
      && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'deku2026')
      && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.proof == 'deploy')
      && needs.source.result == 'success' && needs.quality.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # CLOUD.84 S41(3): the candidate publishes the Hello probe and the migrator with the SDK of global.json; the deploy jobs have no .NET step.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run candidate
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloud-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/candidate
          if-no-files-found: error
          retention-days: 30
          compression-level: 1

  verify:
    name: Verify
    if: >-
      always() && github.event_name != 'push' && github.event_name != 'schedule'
      && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'deku2026')
      && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.proof == 'deploy')
    needs: [source, quality, dependency-review, codeql, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all applicable checks
        env:
          SOURCE: ${{ needs.source.result }}
          QUALITY: ${{ needs.quality.result }}
          REVIEW: ${{ needs.dependency-review.result }}
          CODEQL: ${{ needs.codeql.result }}
          CANDIDATE: ${{ needs.candidate.result }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$SOURCE" = success
          test "$QUALITY" = success
          test "$CODEQL" = success
          test "$CANDIDATE" = success
          if [ "$EVENT" = pull_request ]; then test "$REVIEW" = success; else test "$REVIEW" = skipped; fi

  ctr06-security-bridge-authority:
    name: Require authenticated bootstrap authority evidence
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # There is no configured authenticated owner/provider evidence source or trust anchor.
    # This job declares no GitHub token permissions or OIDC and invokes no checkout/action.
    # Effective external identity and delegation paths remain unproven.
    # Test-only mock graphs and user-supplied inputs cannot unlock the production gate.
    permissions: {}
    steps:
      - name: Refuse unproven authority
        run: |
          echo 'Security bridge authority: NOT PROVEN (no authenticated permission evidence source configured)' >&2
          exit 1

  ctr06-security-bridge-linux:
    name: Construct security bridge (Linux)
    needs: [ctr06-security-bridge-authority]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.ctr06-security-bridge-authority.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.4"
          cache: false
      - run: npm ci --ignore-scripts
      - name: Construct and verify the fixed-source Linux bridge
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/ctr06-source" 8e5f6e26aa97b123d9f60b91f780364a094e74cd
          curl --fail --silent --show-error --location https://go.dev/dl/go1.27.4.linux-amd64.tar.gz -o "$RUNNER_TEMP/go1.27.4.linux-amd64.tar.gz"
          node tooling/ctr06-security-bridge-producer.ts linux "$RUNNER_TEMP/ctr06-source" "$RUNNER_TEMP/go1.27.4.linux-amd64.tar.gz" "$(command -v go)" "$RUNNER_TEMP/ctr06-linux"
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ctr06-security-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ctr06-linux/sealed
          if-no-files-found: error
          retention-days: 30
          compression-level: 1

  ctr06-security-bridge-windows:
    name: Construct security bridge (Windows)
    needs: [ctr06-security-bridge-authority]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.ctr06-security-bridge-authority.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.4"
          cache: false
      - run: npm ci --ignore-scripts
      - name: Construct and verify the fixed-source Windows bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'ctr06-source'
          $archive = Join-Path $env:RUNNER_TEMP 'go1.27.4.windows-amd64.zip'
          $output = Join-Path $env:RUNNER_TEMP 'ctr06-windows'
          git worktree add --detach $source 8e5f6e26aa97b123d9f60b91f780364a094e74cd
          if ($LASTEXITCODE -ne 0) { throw 'Bridge source checkout failed' }
          curl.exe --fail --silent --show-error --location https://go.dev/dl/go1.27.4.windows-amd64.zip -o $archive
          if ($LASTEXITCODE -ne 0) { throw 'Go archive retrieval failed' }
          node tooling/ctr06-security-bridge-producer.ts windows $source $archive (Get-Command go.exe).Source $output
          if ($LASTEXITCODE -ne 0) { throw 'Native bridge construction failed' }
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ctr06-security-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ctr06-windows/sealed
          if-no-files-found: error
          retention-days: 30
          compression-level: 1

  ctr06-security-bridge-seal:
    name: Verify and seal the same-run bridge carrier
    needs:
      [ctr06-security-bridge-authority, ctr06-security-bridge-linux, ctr06-security-bridge-windows]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.ctr06-security-bridge-authority.result == 'success'
      && needs.ctr06-security-bridge-linux.result == 'success'
      && needs.ctr06-security-bridge-windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.4"
          cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.ctr06-security-bridge-linux.outputs.artifact-id }}
          path: ${{ runner.temp }}/ctr06-linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.ctr06-security-bridge-windows.outputs.artifact-id }}
          path: ${{ runner.temp }}/ctr06-windows
      - name: Recheck source, components and sealed carrier
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/ctr06-source" 8e5f6e26aa97b123d9f60b91f780364a094e74cd
          curl --fail --silent --show-error --location https://go.dev/dl/go1.27.4.linux-amd64.tar.gz -o "$RUNNER_TEMP/go1.27.4.linux-amd64.tar.gz"
          node tooling/ctr06-security-bridge-seal.ts "$RUNNER_TEMP/ctr06-source" "$RUNNER_TEMP/ctr06-linux" "$RUNNER_TEMP/ctr06-windows" "$RUNNER_TEMP/go1.27.4.linux-amd64.tar.gz" "$(command -v go)" "$RUNNER_TEMP/ctr06-seal"
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ctr06-security-sealed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ctr06-seal/sealed
          if-no-files-found: error
          retention-days: 30
          compression-level: 1

  ctr06-security-bridge-publish:
    name: Publish the single security bridge bootstrap
    concurrency:
      group: ctr06-security-bridge-bootstrap
      cancel-in-progress: false
    needs: [ctr06-security-bridge-authority, ctr06-security-bridge-seal]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.ctr06-security-bridge-authority.result == 'success'
      && needs.ctr06-security-bridge-seal.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.ctr06-security-bridge-seal.outputs.artifact-id }}
          path: ${{ runner.temp }}/ctr06-sealed
      - name: Publish verified build-only carrier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"),p=process.argv[1],r=JSON.parse(fs.readFileSync(p+"/bootstrap-receipt.json")); if(r.schema!=="arcforges.ctr06-security-bridge-bootstrap.v1" || r.producer.commit!==process.env.GITHUB_SHA || r.producer.runId!==process.env.GITHUB_RUN_ID || r.producer.runAttempt!==Number(process.env.GITHUB_RUN_ATTEMPT) || r.version!==`0.1.0-ci.${process.env.GITHUB_RUN_NUMBER}.${process.env.GITHUB_RUN_ATTEMPT}` || r.carrier.name!==`arcforges-ctr06-security-bridge-${r.version}.tar.gz`) process.exit(1); const h=require("crypto").createHash("sha256").update(fs.readFileSync(p+"/"+r.carrier.name)).digest("hex"); if(h!==r.carrier.sha256) process.exit(1);' "$RUNNER_TEMP/ctr06-sealed"
          existing=$(gh api --paginate --slurp 'repos/ArcForges/Cloud/releases?per_page=100' --jq '[.[][] | select(.tag_name | startswith("ctr06-security-bridge-cloud-"))] | length')
          test "$existing" = 0
          version="0.1.0-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          gh release create "ctr06-security-bridge-cloud-${version}" "$RUNNER_TEMP/ctr06-sealed/arcforges-ctr06-security-bridge-${version}.tar.gz" "$RUNNER_TEMP/ctr06-sealed/bootstrap-receipt.json" --repo ArcForges/Cloud --target "$GITHUB_SHA" --title "CTR06 security bridge ${version}" --prerelease

  ctr06-bridge-assets-state:
    name: Check immutable self-hosted bridge assets
    # Contradictory event predicates make this historical asset job unreachable during phase 1.
    if: github.event_name == 'push' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      linux-present: ${{ steps.state.outputs.linux_present }}
      windows-present: ${{ steps.state.outputs.windows_present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: state
        name: Check only release metadata
        run: python eng/verification/ctr06_bridge_asset_state.py >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  ctr06-bridge-linux-asset:
    name: Seal the released Linux bridge for self-hosting
    needs: [ctr06-bridge-assets-state]
    if: >-
      !cancelled() && needs.ctr06-bridge-assets-state.result == 'success'
      && needs.ctr06-bridge-assets-state.outputs.linux-present == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 8e5f6e26aa97b123d9f60b91f780364a094e74cd
          path: bridge-source
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.3"
          cache: false
      - name: Verify the original carrier and seal the native asset
        env:
          GH_TOKEN: ${{ github.token }}
          GOTOOLCHAIN: local
          GOWORK: "off"
          GOTELEMETRY: "off"
        run: |
          mkdir -m 700 "$RUNNER_TEMP/ctr06-release" "$RUNNER_TEMP/ctr06-content" "$RUNNER_TEMP/ctr06-linux"
          gh release download cloud-0.1.0-ci.615.1 --repo ArcForges/Cloud --pattern cloud-0.1.0-ci.615.1.tar.gz --dir "$RUNNER_TEMP/ctr06-release"
          python tooling/ctr06_bridge_carrier.py "$RUNNER_TEMP/ctr06-release/cloud-0.1.0-ci.615.1.tar.gz" "$RUNNER_TEMP/ctr06-content" "$RUNNER_TEMP/ctr06-linux/arcforges-center"
          python eng/verification/ctr06_bridge_bundle.py build linux "$GITHUB_WORKSPACE/bridge-source" "$RUNNER_TEMP/ctr06-linux/arcforges-center" "$RUNNER_TEMP/ctr06-linux/arcforges-ctr06-bridge-8e5-linux-amd64.zip"
          cp "$RUNNER_TEMP/ctr06-release/cloud-0.1.0-ci.615.1.tar.gz" "$RUNNER_TEMP/ctr06-linux/cloud-0.1.0-ci.615.1.tar.gz"
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ctr06-bridge-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ctr06-linux/arcforges-ctr06-bridge-8e5-linux-amd64.zip
            ${{ runner.temp }}/ctr06-linux/cloud-0.1.0-ci.615.1.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 1

  ctr06-bridge-windows-asset:
    name: Build and seal the native Windows bridge
    needs: [ctr06-bridge-assets-state]
    if: >-
      !cancelled() && needs.ctr06-bridge-assets-state.result == 'success'
      && needs.ctr06-bridge-assets-state.outputs.windows-present == 'false'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 8e5f6e26aa97b123d9f60b91f780364a094e74cd
          path: bridge-source
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: bridge-source/center/go.sum
      - name: Build and seal from the exact reviewed source
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOTOOLCHAIN: local
          GOWORK: "off"
          GOFLAGS: -mod=readonly
          GOTELEMETRY: "off"
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'bridge-source'
          $output = Join-Path $env:RUNNER_TEMP 'ctr06-windows'
          New-Item -ItemType Directory -Path $output | Out-Null
          Push-Location (Join-Path $source 'center')
          try {
            go mod download
            if ($LASTEXITCODE -ne 0) { throw 'Bridge module download failed' }
            go mod verify
            if ($LASTEXITCODE -ne 0) { throw 'Bridge module verification failed' }
            $binary = Join-Path $output 'arcforges-center.exe'
            $link = '-buildid= -X=github.com/ArcForges/Cloud/center/internal/buildinfo.sourceCommit=8e5f6e26aa97b123d9f60b91f780364a094e74cd -X=github.com/ArcForges/Cloud/center/internal/buildinfo.sourceDirty=false'
            go build -trimpath -buildvcs=false -ldflags $link -o $binary ./cmd/arcforges-center
            if ($LASTEXITCODE -ne 0) { throw 'Native bridge build failed' }
            $identity = & $binary version | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $identity.build.sourceCommit -ne '8e5f6e26aa97b123d9f60b91f780364a094e74cd' -or $identity.build.dirty) { throw 'Native bridge identity differs' }
            python (Join-Path $env:GITHUB_WORKSPACE 'eng/verification/ctr06_bridge_bundle.py') build windows $source $binary (Join-Path $output 'arcforges-ctr06-bridge-8e5-windows-amd64.zip')
            if ($LASTEXITCODE -ne 0) { throw 'Native bridge seal failed' }
          } finally { Pop-Location }
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ctr06-bridge-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ctr06-windows/arcforges-ctr06-bridge-8e5-windows-amd64.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 1

  deploy:
    name: Deploy Cloudflare
    # Phase 1 is build-and-publish only. A reviewed phase 2 must explicitly restore delivery.
    if: >-
      false && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.candidate.result == 'success' && needs.ctr06-bridge-assets-state.result == 'success'
      && (needs.ctr06-bridge-assets-state.outputs.linux-present == 'true' || needs.ctr06-bridge-linux-asset.result == 'success')
      && (needs.ctr06-bridge-assets-state.outputs.windows-present == 'true' || needs.ctr06-bridge-windows-asset.result == 'success')
    needs:
      [candidate, ctr06-bridge-assets-state, ctr06-bridge-linux-asset, ctr06-bridge-windows-asset]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare
    concurrency:
      group: cloudflare-main
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          path: artifacts/candidate
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.ctr06-bridge-assets-state.outputs.linux-present == 'false'
        with:
          artifact-ids: ${{ needs.ctr06-bridge-linux-asset.outputs.artifact-id }}
          path: artifacts/ctr06-linux
          merge-multiple: true
      - name: Verify the sealed Linux bridge asset
        if: needs.ctr06-bridge-assets-state.outputs.linux-present == 'false'
        run: |
          python eng/verification/ctr06_bridge_bundle.py verify linux "$GITHUB_WORKSPACE/artifacts/ctr06-linux/arcforges-ctr06-bridge-8e5-linux-amd64.zip"
          node tooling/project.ts verify-bridge-asset linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.ctr06-bridge-assets-state.outputs.windows-present == 'false'
        with:
          artifact-ids: ${{ needs.ctr06-bridge-windows-asset.outputs.artifact-id }}
          path: artifacts/ctr06-windows
          merge-multiple: true
      - name: Verify the sealed Windows bridge asset
        if: needs.ctr06-bridge-assets-state.outputs.windows-present == 'false'
        run: |
          python eng/verification/ctr06_bridge_bundle.py verify windows "$GITHUB_WORKSPACE/artifacts/ctr06-windows/arcforges-ctr06-bridge-8e5-windows-amd64.zip"
          node tooling/project.ts verify-bridge-asset windows
      # CLOUD.70: the one gated D1 migration step, before anything is pushed or promoted. It holds the migrator
      # lease and fence, applies only what the release manifest names, prints receipts and the compatibility
      # record (never a secret) and refuses a build the schema horizons exclude. A failure fails this job here,
      # so the promotion step below never runs; tooling/cloudflare.ts also refuses without the step's record.
      - name: Migrate the D1 database (gated)
        run: node eng/migrations/deploy.ts deploy --target production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # AF-CTR-02: the sealed image's own center executable migrates the production PostgreSQL database with the migration role's
      # direct connection and reconciles the runtime role's grants, before anything is pushed or promoted. It prints the database,
      # roles, versions and checksums, never a credential; npm run deploy refuses without its passed record for this candidate.
      # NEON_DATABASE_URL is read only to compare its role name with the migration role's before PUBLIC's CONNECT is revoked
      # (the C# Hello and its rollback connect with it); no value of either URL is printed.
      - name: Migrate the PostgreSQL database (gated)
        run: node tooling/postgres-deploy.ts migrate --target production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DATABASE_URL_DIRECT: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
      # The runtime credential is rotated inside this step and uploaded with the Worker version; it is never printed or stored.
      - run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DATABASE_URL_DIRECT: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
          GH_TOKEN: ${{ github.token }}
      - name: Publish deployed prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync("artifacts/candidate/manifest.json")).version)')
          tar -czf "artifacts/cloud-${VERSION}.tar.gz" -C artifacts/candidate .
          assets=("artifacts/cloud-${VERSION}.tar.gz" artifacts/deployment.json)
          if [ -f artifacts/ctr06-linux/arcforges-ctr06-bridge-8e5-linux-amd64.zip ]; then assets+=(artifacts/ctr06-linux/arcforges-ctr06-bridge-8e5-linux-amd64.zip); fi
          if [ -f artifacts/ctr06-windows/arcforges-ctr06-bridge-8e5-windows-amd64.zip ]; then assets+=(artifacts/ctr06-windows/arcforges-ctr06-bridge-8e5-windows-amd64.zip); fi
          gh release create "cloud-${VERSION}" "${assets[@]}" --target "$GITHUB_SHA" --title "Cloud ${VERSION}" --prerelease --generate-notes
      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudflare-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/deployment.json
            artifacts/migration-gate-production.json
            artifacts/postgres-gate-production.json
          if-no-files-found: warn
          retention-days: 90

  proof-access:
    name: Proof Cloudflare access and resources
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && inputs.proof != 'none' && inputs.proof != 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare
    concurrency:
      group: cloudflare-proof
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      # Reads (and, for provision, idempotently creates) only the reserved proof resources; observe
      # only reads the proof Container application. Output names capabilities, states and HTTP statuses and,
      # for observe, allowlisted provider fields; no token, secret, environment value or log line is printed.
      - name: Verify token access and provision or observe the reserved proof resources
        run: |
          case "$PROOF_ACTION" in
            access) npm run access:proof ;;
            observe) npm run observe:proof ;;
            *) npm run provision:proof ;;
          esac
        env:
          PROOF_ACTION: ${{ inputs.proof }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  proof-gate:
    name: Proof gate (host-verified tree and main-push candidate)
    # The proof deployment re-validates nothing: both host legs verified the merged tree (AD-0020) and the main push built the
    # candidate. This job proves both through the API, holds no secret and fails closed: main's head is a PR merge commit (or a
    # fast-forward) whose tree is the tree of a commit whose latest arcforges/linux and arcforges/windows statuses are success, posted
    # by deku2026 in the shape eng/verify.py writes, and the successful main-push run of that commit holds its candidate artifact.
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && inputs.proof == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
      actions: read
      pull-requests: read
    outputs:
      tree: ${{ steps.gate.outputs.tree }}
      run-id: ${{ steps.gate.outputs.run-id }}
      run-number: ${{ steps.gate.outputs.run-number }}
      run-attempt: ${{ steps.gate.outputs.run-attempt }}
      candidate-attempt: ${{ steps.gate.outputs.candidate-attempt }}
      artifact-id: ${{ steps.gate.outputs.artifact-id }}
      artifact-digest: ${{ steps.gate.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: gate
        name: Prove the host verification of the merged tree and find the main-push candidate
        run: node eng/verification/proof-gate.ts gate
        env:
          GH_TOKEN: ${{ github.token }}

  deploy-proof:
    name: Deploy Cloudflare proof environment
    # Phase 1 cannot promote any bridge; phase 2 must explicitly review and restore this path.
    if: >-
      false && !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && inputs.proof == 'deploy' && needs.proof-gate.result == 'success'
      && needs.proof-access.result == 'success'
    needs: [proof-gate, proof-access]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare
    concurrency:
      group: cloudflare-proof-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    # The producer of the candidate is the main-push run the gate found; tooling/build-identity.ts accepts it on a dispatch only.
    env:
      ARCFORGES_CANDIDATE_RUN_ID: ${{ needs.proof-gate.outputs.run-id }}
      ARCFORGES_CANDIDATE_RUN_NUMBER: ${{ needs.proof-gate.outputs.run-number }}
      ARCFORGES_CANDIDATE_RUN_ATTEMPT: ${{ needs.proof-gate.outputs.run-attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      # The gated candidate, by run ID and artifact ID: its SHA-256 must equal the API's artifact digest and its sealed manifest
      # must name this commit, its tree and the main-push run before anything below migrates or deploys.
      - name: Fetch the gated main-push candidate
        run: node eng/verification/proof-gate.ts fetch
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_GATE_TREE: ${{ needs.proof-gate.outputs.tree }}
          PROOF_GATE_CANDIDATE_ATTEMPT: ${{ needs.proof-gate.outputs.candidate-attempt }}
          PROOF_GATE_ARTIFACT_ID: ${{ needs.proof-gate.outputs.artifact-id }}
          PROOF_GATE_ARTIFACT_DIGEST: ${{ needs.proof-gate.outputs.artifact-digest }}
      # CLOUD.70: the same gated D1 migration step against the retained proof D1 database (still bound, no longer used by the
      # acceptance center; AF-CTR-09 inspects and keeps it), before the Worker or image is promoted.
      - name: Migrate the proof D1 database (gated)
        run: node eng/migrations/deploy.ts deploy --target proof
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # AF-CTR-02: the acceptance center's own PostgreSQL database (arcforges_acceptance, created idempotently through the
      # migration role's direct connection) is migrated with its own runtime role before the acceptance Worker is promoted.
      - name: Migrate the acceptance PostgreSQL database (gated)
        run: node tooling/postgres-deploy.ts migrate --target acceptance
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          NEON_DATABASE_URL_DIRECT: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
      # The sealed candidate is promoted unchanged as the Go center in official-hosted mode. The acceptance runtime credential is
      # rotated inside this step, uploaded with the Worker version and never printed or stored; the production Worker, its route
      # and its version are not touched.
      - run: npm run deploy:proof
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_DATABASE_URL_DIRECT: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
          GH_TOKEN: ${{ github.token }}
          # The owner bootstrap of this dispatch (digest and expiry, both or neither), validated by buildProofConfig and recorded in
          # proof-deployment.json; the one-time token itself never reaches CI.
          PROOF_BOOTSTRAP_SHA256: ${{ inputs.bootstrap_sha256 }}
          PROOF_BOOTSTRAP_EXPIRES_AT: ${{ inputs.bootstrap_expires_at }}
      - name: Preserve proof deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: proof-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/proof-deployment.json
            artifacts/proof-key-registration.json
            artifacts/migration-gate-proof.json
            artifacts/postgres-gate-acceptance.json
          if-no-files-found: warn
          retention-days: 90
