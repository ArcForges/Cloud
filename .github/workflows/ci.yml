name: CI
# Owner (deku2026) PRs are verified by the host verification after the push (eng/verify.py, AD-0020), so the validation and security
# jobs skip for them; every other PR (Dependabot included) and a manual dispatch keep the full coverage. A main push runs
# only delivery: the candidate build and its deployment. The weekly schedule runs the security analysis: CodeQL and the
# quality job (dependency audit, secret scan and the hosted architecture gate that must follow the scan in that job).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      proof:
        description: >-
          The acceptance environment (the proof Worker on proof.arcforges.com; main only). none: nothing.
          access: verify the deployment token's R2, Queues, Workers and zone permissions. provision: access
          plus idempotent creation of the center's acceptance R2 bucket (with its lifecycle rules) and
          queues. deploy: provision plus the acceptance PostgreSQL database and the deployment of the sealed
          candidate as the Go center. observe: a read-only report of the Container application, its
          instances and rollouts; nothing is created or changed.
        type: choice
        options: [none, access, provision, deploy, observe]
        default: none
      bootstrap_sha256:
        description: >-
          Proof deploy only: the SHA-256 (64 lowercase hex characters) of the owner bootstrap token, as
          eng/verification/proof-bootstrap.ts prints it on the owner's machine. Never paste the token itself. Leave empty on
          every dispatch after the owner exists. Set together with bootstrap_expires_at.
        type: string
        required: false
        default: ""
      bootstrap_expires_at:
        description: >-
          Proof deploy only: when the bootstrap token expires, an RFC 3339 UTC instant to the second (2026-11-02T10:00:00Z),
          in the future and at most seven days ahead. Set together with bootstrap_sha256.
        type: string
        required: false
        default: ""
  schedule:
    - cron: "43 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"

jobs:
  source:
    name: Source (${{ matrix.os }})
    if: github.event_name != 'push' && github.event_name != 'schedule' && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'deku2026')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: ${{ matrix.os == 'ubuntu-latest' && 'npm' || '' }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
        if: runner.os == 'Linux'
      - run: npm run check:dotnet
        if: runner.os == 'Linux'
      - name: Compile managed solution on Windows
        if: runner.os == 'Windows'
        run: |
          dotnet restore Cloud.slnx --locked-mode
          dotnet build Cloud.slnx -c Release --no-restore
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            center/go.sum
            center/tools/go.sum
      # The same entry point as both verification legs: the race detector and fuzzing on Linux, the native build on both.
      - name: Verify the Go center
        run: python eng/center.py check
      - run: node tooling/project.ts licence-evaluated
      - name: Retain evaluated licence and source provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: licence-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/evidence/licence-*.json
            artifacts/evidence/source-provenance.json
          if-no-files-found: error
          retention-days: 30

  quality:
    name: Dependency audit and repository checks
    if: github.event_name != 'push' && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'deku2026')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      # The isolated browser-acceptance package has its own lock and is never installed here; its advisories are read from the lock.
      - run: npm audit --audit-level=high --prefix eng/verification/browser
      - name: Check workflow syntax
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Scan Git history for secrets
        run: docker run --rm --network none -v "$PWD:/repo:ro" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact=100 --no-banner
      # GOV.09: the hosted architecture gate runs only after the secret scan above succeeded (RP-09), in this same job.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Build the solution for the architecture gate
        run: |
          dotnet restore Cloud.slnx --locked-mode
          dotnet build Cloud.slnx -c Release --no-restore
      - name: Forbidden-term scan
        run: npm run policy
      - name: Architecture policy gate (hosted)
        env:
          ARCFORGES_ARCHITECTURE_GATE: hosted
        run: dotnet test --project tests/ArchitectureTests -c Release --no-build --filter-class ArcForges.Cloud.ArchitectureTests.EvaluatedRepositoryGate

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'deku2026')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL (${{ matrix.language }})
    if: github.event_name != 'push' && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'deku2026')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: matrix.language == 'go'
        with:
          go-version: "1.27.3"
          cache-dependency-path: center/go.sum
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build C# for analysis
        if: matrix.language == 'csharp'
        run: |
          dotnet restore src/ArcForges.Cloud --locked-mode
          dotnet build src/ArcForges.Cloud -c Release --no-restore
      # The center and its test packages; the bindings are the published Contracts Go module, so no .NET restore is needed.
      - name: Build Go for analysis
        if: matrix.language == 'go'
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
        run: |
          cd center
          go mod download
          go build ./...
          go test -count=1 -run '^$' ./...
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: /language:${{ matrix.language }}

  candidate:
    name: Native AOT image and Worker build
    # Delivery on a main push (the bytes deploy ships; the PR was verified before merge, so nothing re-validates it);
    # validation after source and quality for every other PR and a dispatch. Owner PRs build it in the local hook.
    needs: [source, quality]
    if: >-
      !cancelled() && (github.event_name == 'push' || (github.event_name != 'schedule'
      && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'deku2026')
      && needs.source.result == 'success' && needs.quality.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # CLOUD.84 S41(3): the candidate publishes the Hello probe and the migrator with the SDK of global.json; the deploy jobs have no .NET step.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run candidate
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloud-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/candidate
          if-no-files-found: error
          retention-days: 30
          compression-level: 1

  verify:
    name: Verify
    if: always() && github.event_name != 'push' && github.event_name != 'schedule' && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'deku2026')
    needs: [source, quality, dependency-review, codeql, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all applicable checks
        env:
          SOURCE: ${{ needs.source.result }}
          QUALITY: ${{ needs.quality.result }}
          REVIEW: ${{ needs.dependency-review.result }}
          CODEQL: ${{ needs.codeql.result }}
          CANDIDATE: ${{ needs.candidate.result }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$SOURCE" = success
          test "$QUALITY" = success
          test "$CODEQL" = success
          test "$CANDIDATE" = success
          if [ "$EVENT" = pull_request ]; then test "$REVIEW" = success; else test "$REVIEW" = skipped; fi

  deploy:
    name: Deploy Cloudflare
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.candidate.result == 'success'
    needs: [candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare
    concurrency:
      group: cloudflare-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          path: artifacts/candidate
          merge-multiple: true
      # CLOUD.70: the one gated D1 migration step, before anything is pushed or promoted. It holds the migrator
      # lease and fence, applies only what the release manifest names, prints receipts and the compatibility
      # record (never a secret) and refuses a build the schema horizons exclude. A failure fails this job here,
      # so the promotion step below never runs; tooling/cloudflare.ts also refuses without the step's record.
      - name: Migrate the D1 database (gated)
        run: node eng/migrations/deploy.ts deploy --target production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # AF-CTR-02: the sealed image's own center executable migrates the production PostgreSQL database with the migration role's
      # direct connection and reconciles the runtime role's grants, before anything is pushed or promoted. It prints the database,
      # roles, versions and checksums, never a credential; npm run deploy refuses without its passed record for this candidate.
      # NEON_DATABASE_URL is read only to compare its role name with the migration role's before PUBLIC's CONNECT is revoked
      # (the C# Hello and its rollback connect with it); no value of either URL is printed.
      - name: Migrate the PostgreSQL database (gated)
        run: node tooling/postgres-deploy.ts migrate --target production
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DATABASE_URL_DIRECT: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
      # The runtime credential is rotated inside this step and uploaded with the Worker version; it is never printed or stored.
      - run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DATABASE_URL_DIRECT: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
          GH_TOKEN: ${{ github.token }}
      - name: Publish deployed prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync("artifacts/candidate/manifest.json")).version)')
          tar -czf "artifacts/cloud-${VERSION}.tar.gz" -C artifacts/candidate .
          gh release create "cloud-${VERSION}" "artifacts/cloud-${VERSION}.tar.gz" artifacts/deployment.json --target "$GITHUB_SHA" --title "Cloud ${VERSION}" --prerelease --generate-notes
      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudflare-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/deployment.json
            artifacts/migration-gate-production.json
            artifacts/postgres-gate-production.json
          if-no-files-found: warn
          retention-days: 90

  proof-access:
    name: Proof Cloudflare access and resources
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && inputs.proof != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare
    concurrency:
      group: cloudflare-proof
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      # Reads (and, for provision and deploy, idempotently creates) only the reserved proof resources; observe
      # only reads the proof Container application. Output names capabilities, states and HTTP statuses and,
      # for observe, allowlisted provider fields; no token, secret, environment value or log line is printed.
      - name: Verify token access and provision or observe the reserved proof resources
        run: |
          case "$PROOF_ACTION" in
            access) npm run access:proof ;;
            observe) npm run observe:proof ;;
            *) npm run provision:proof ;;
          esac
        env:
          PROOF_ACTION: ${{ inputs.proof }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-proof:
    name: Deploy Cloudflare proof environment
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && inputs.proof == 'deploy' && needs.verify.result == 'success'
      && needs.candidate.result == 'success' && needs.proof-access.result == 'success'
    needs: [verify, candidate, proof-access]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare
    concurrency:
      group: cloudflare-proof-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          path: artifacts/candidate
          merge-multiple: true
      # CLOUD.70: the same gated D1 migration step against the retained proof D1 database (still bound, no longer used by the
      # acceptance center; AF-CTR-09 inspects and keeps it), before the Worker or image is promoted.
      - name: Migrate the proof D1 database (gated)
        run: node eng/migrations/deploy.ts deploy --target proof
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # AF-CTR-02: the acceptance center's own PostgreSQL database (arcforges_acceptance, created idempotently through the
      # migration role's direct connection) is migrated with its own runtime role before the acceptance Worker is promoted.
      - name: Migrate the acceptance PostgreSQL database (gated)
        run: node tooling/postgres-deploy.ts migrate --target acceptance
        env:
          NEON_DATABASE_URL_DIRECT: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
      # The sealed candidate is promoted unchanged as the Go center in official-hosted mode. The acceptance runtime credential is
      # rotated inside this step, uploaded with the Worker version and never printed or stored; the production Worker, its route
      # and its version are not touched.
      - run: npm run deploy:proof
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_DATABASE_URL_DIRECT: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
          GH_TOKEN: ${{ github.token }}
          # The owner bootstrap of this dispatch (digest and expiry, both or neither), validated by buildProofConfig and recorded in
          # proof-deployment.json; the one-time token itself never reaches CI.
          PROOF_BOOTSTRAP_SHA256: ${{ inputs.bootstrap_sha256 }}
          PROOF_BOOTSTRAP_EXPIRES_AT: ${{ inputs.bootstrap_expires_at }}
      - name: Preserve proof deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: proof-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/proof-deployment.json
            artifacts/migration-gate-proof.json
            artifacts/postgres-gate-acceptance.json
          if-no-files-found: warn
          retention-days: 90
