name: Bug report
description: Report a reproducible Cloud issue
body:
  - type: markdown
    attributes:
      value: Do not include credentials. Report vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and affected commit
      description: Include platform, command and redacted logs.
    validations:
      required: true
